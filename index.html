<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARKET//TERM">
<title>MARKET//TERM — Simulation</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080a0e;color:#e9edf1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{overflow:hidden}.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-bottom:1px solid #252a31;font-size:11px;color:#9ba7b5;letter-spacing:.04em}header b{color:#f0f3f7;font-weight:600}.live{display:flex;align-items:center;gap:6px}.led{width:6px;height:6px;border-radius:50%;background:#9fd4ac;box-shadow:0 0 9px #76c58a}.logs{flex:1;overflow-y:auto;padding:13px 12px 20px;font-size:11.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:none}.logs::-webkit-scrollbar{display:none}.line{min-height:1.65em}.line.muted{color:#8f9baa}.line.bright{color:#fff}.line.good{color:#afd9bd}.line.warn{color:#e0cd9f}.cursor{display:inline-block;width:6px;height:12px;background:#edf1f4;vertical-align:-2px;animation:blink .8s step-end infinite}@keyframes blink{50%{opacity:0}}footer{border-top:1px solid #252a31;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;color:#98a3b0;font-size:10px}.actions{display:flex;gap:5px}button{border:1px solid #3c4654;color:#e7ebf0;background:#181d25;border-radius:5px;padding:7px 8px;font:inherit;font-size:10px}button:active{background:#323b49}.detail{color:#7c8794}@media(max-width:365px){footer{font-size:9px}.logs{font-size:10.5px}button{padding:6px 6px}}
</style>
</head>
<body><div class="app">
<header><div><b>MARKET//TERM</b> <span class="detail"> / quant-research</span></div><div class="live"><span class="led"></span><span id="state">SIMULATED LIVE</span></div></header>
<main id="logs" class="logs" aria-label="架空の金融市場分析ログ"></main>
<footer><span>DEMO · NO REAL DATA</span><div class="actions"><button id="speed">SPEED ×1</button><button id="pause">PAUSE</button><button id="clear">CLEAR</button></div></footer>
</div>
<script>
(()=>{'use strict';
const el=document.getElementById('logs'),speedBtn=document.getElementById('speed'),pauseBtn=document.getElementById('pause'),state=document.getElementById('state');
let speed=1,paused=false,token=0,lines=0,current=null,phase='normal',phaseLeft=0;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choose=a=>a[rnd(0,a.length-1)],pct=()=>((Math.random()-.5)*4).toFixed(2)+'%',value=(a,b,d=2)=>(a+Math.random()*(b-a)).toFixed(d),id=()=>rnd(10000,99999),symbols=['SPX','NDX','DJI','VIX','USDJPY','EURUSD','UST10Y','DXY','GOLD','BTCUSD','NIKKEI225','TOPIX','WTI','EURJPY','USDCNH','SOX','NASDAQ100'],models=['GARCH(1,1)','EWMA','Kalman filter','Monte Carlo','Black-Scholes','ARIMA(2,1,2)','factor regression','Heston stochastic volatility','Bayesian state-space','principal component analysis'],stages=['order book reconstruction','liquidity surface estimation','cross-asset covariance','yield curve normalization','factor exposure calibration','signal noise separation','volatility regime classification','tail risk estimation','market microstructure scan','intraday momentum decomposition'];
const templates=[
()=>['',`${choose(symbols)}  LAST ${value(110,48210)}  Δ ${pct()}  VOL ${rnd(23000,9000000).toLocaleString('en-US')}`],
()=>['muted',`[${new Date().toLocaleTimeString('en-GB',{hour12:false})}] feed.sync  ${choose(symbols)} / ${choose(['1m','5m','15m','1h','1d'])}  packets=${rnd(100,9000)}`],
()=>['',`>> ${choose(stages)}  :: batch ${id()}`],
()=>['',`σ=${value(.05,.98,5)}  β=${value(.6,1.8,4)}  α=${value(-.02,.04,5)}  R²=${value(.7,.99,4)}`],
()=>['muted',`factor[${choose(['MKT','SIZE','VALUE','MOM','QUALITY','LOWVOL'])}]: z=${value(-3,3,3)}  weight=${value(0,1,5)}`],
()=>['',`risk.var(99%, 1d)=${value(.5,5.5)}%  expected_shortfall=${value(1,7)}%`],
()=>['bright',`[SIGNAL] ${choose(symbols)} / ${choose(['NEUTRAL','RISK_ON','RISK_OFF','WATCH','REBALANCE_PENDING'])}  confidence=${value(50,99)}%`],
()=>['muted',`model/${choose(models).replaceAll(' ','_')}  fit_score=${value(.7,.9999,5)}`],
()=>['',`correlation.matrix(${choose(symbols)},${choose(symbols)}) => ${value(-1,1,6)}`],
()=>['',`spread=${value(.01,3,4)}bps | imbalance=${value(-.9,.9,4)} | depth=${rnd(100,90000)}`],
()=>['muted',`0x${rnd(1e7,9e7).toString(16)} :: ${rnd(1000,9999)} ${rnd(1000,9999)} ${rnd(1000,9999)}`],
()=>['',`/research/strategy/${choose(['macro','momentum','mean_reversion','vol_surface'])}/run_${id()}.log`],
()=>['',`FUTURES ${choose(['ES','NQ','YM','NK','CL','GC'])}${rnd(1,9)} | basis ${value(-12,12,3)} | carry ${value(-2,6,3)}`],
()=>['muted',`tick ${id()}  ${choose(symbols).padEnd(10)} BID ${value(120,30000,3)} / ASK ${value(120,30000,3)}`],
()=>['',`[MODEL] ${choose(models)} complete; observations=${rnd(250,180000)}, iterations=${rnd(20,2500)}, convergence=${value(.000001,.001,7)}`],
()=>['',`portfolio.factor_exposure = [${Array.from({length:rnd(3,11)},()=>value(-1,1,4)).join(', ')}]`],
()=>['good',`[ OK ] ${choose(['feed snapshot validated','matrix decomposition completed','scenario cache ready','synthetic backtest synchronized'])}`],
()=>['',`macro: CPI=${value(1.1,5.2)}%, policy_rate=${value(0,6)}%, breakeven_10y=${value(1.4,3.2)}%, term_premium=${value(-.6,1.6)}%`]
];
const phases=[['LOADING market data...',9,17],['analyzing volatility surface...',12,20],['calibrating predictive model...',9,15],['processing order flow...',8,17],['analyzing cross-asset correlations...',12,21],['reconstructing liquidity matrix...',11,18]];
function startLine(kind=''){const line=document.createElement('div');line.className='line '+kind;el.appendChild(line);if(el.children.length>450)el.firstElementChild.remove();return line}
function viewBottom(){el.scrollTop=el.scrollHeight}
function writeInstant(msg,kind=''){const line=startLine(kind);line.textContent=msg;viewBottom()}
function selectMessage(){if(Math.random()<.115){phase='loading';phaseLeft=rnd(3,7);const [txt,a,b]=choose(phases);return {txt,kind:'warn',loading:true,loadLimit:rnd(a,b),step:0}}let [kind,txt]=choose(templates)();return {txt,kind,loading:false,index:0}}
function nextDelay(){if(phase==='loading')return rnd(210,540);if(phase==='burst')return rnd(9,35);return rnd(45,170)}
function schedule(ms){const stamp=++token;setTimeout(()=>{if(stamp===token&&!paused)run()},Math.max(4,ms/speed))}
function run(){if(!current){current=selectMessage();current.node=startLine(current.kind);current.index=0;current.step=0}
 if(current.loading){current.step++;let limit=current.loadLimit;let dots='.'.repeat((current.step%4)+1);let n=Math.min(99,Math.floor(current.step/limit*100));current.node.textContent=current.txt.replace(/\.+$/,'')+dots+'  '+String(n).padStart(2,' ')+'%';viewBottom();if(current.step>=limit){current.node.textContent=current.txt.replace(/\.+$/,'')+'... 100%  [OK]';current=null;phase='normal';schedule(rnd(180,650));}else schedule(rnd(160,520));return}
 const remaining=current.txt.length-current.index,chunk=phase==='burst'?rnd(5,20):Math.random()<.24?rnd(1,4):rnd(4,14);
 current.index=Math.min(current.txt.length,current.index+chunk);current.node.textContent=current.txt.slice(0,current.index);viewBottom();
 if(current.index>=current.txt.length){current=null;lines++;if(lines%rnd(9,18)===0||Math.random()<.16){phase='burst';phaseLeft=rnd(4,13)}if(phaseLeft>0){phaseLeft--;if(phaseLeft===0)phase='normal'}schedule(phase==='burst'?rnd(12,65):rnd(90,720));}else schedule(nextDelay())
}
speedBtn.onclick=()=>{speed=speed===1?2:speed===2?5:1;speedBtn.textContent='SPEED ×'+speed};
pauseBtn.onclick=()=>{paused=!paused;state.textContent=paused?'PAUSED':'SIMULATED LIVE';pauseBtn.textContent=paused?'RESUME':'PAUSE';if(paused)token++;else schedule(30)};
document.getElementById('clear').onclick=()=>{token++;el.textContent='';current=null;phase='normal';phaseLeft=0;lines=0;writeInstant('market@sim:~$ clear','muted');if(!paused)schedule(200)};
writeInstant('MARKET RESEARCH TERMINAL // SIMULATION MODE','bright');writeInstant('NOTICE: Synthetic market data. No trades or network analysis.','muted');writeInstant('market@sim:~$ ./quant_engine --mode=demo --stream','');schedule(600);
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
