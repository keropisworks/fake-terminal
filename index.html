:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080a0e;color:#edf0f4;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{overflow:hidden}button,select{font:inherit}.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);position:relative}header{border-bottom:1px solid #252b34;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;background:#080a0e;position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:700;font-size:12px;letter-spacing:.06em}.live{font-size:9px;color:#abb6c5;display:flex;align-items:center;gap:5px}.led{height:6px;width:6px;background:#a2d6b0;border-radius:50%;box-shadow:0 0 8px #83cf98}.toolbar{display:flex;align-items:center;gap:8px;justify-content:space-between}.clock{font-size:12px;color:#f5f6f8;font-variant-numeric:tabular-nums;white-space:nowrap}.clock small{font-size:9px;color:#8593a5}.selector{display:flex;align-items:center;gap:5px;min-width:0}.selector label{font-size:9px;color:#8190a0}.selector select{min-width:0;max-width:142px;background:#171c24;border:1px solid #3b4552;border-radius:5px;color:#f2f4f7;padding:6px 5px;font-size:10px}.logs{flex:1;overflow-y:auto;padding:12px 11px 16px;font-size:11.3px;line-height:1.66;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:none}.logs::-webkit-scrollbar{display:none}.line{min-height:1.66em}.line.muted{color:#94a1b1}.line.bright{color:white}.line.good{color:#b8dac3}.line.warn{color:#dfc59b}.line.alert{color:#ffb0a8}.line.event{color:#fff;font-weight:700}footer{border-top:1px solid #252a31;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;font-size:9px;color:#99a6b5;background:#080a0e;position:relative;z-index:1}.actions{display:flex;gap:5px}button{background:#191f28;color:#eff2f6;border:1px solid #3b4653;border-radius:5px;padding:7px 8px;font-size:10px}button:active{background:#323b49}.overlay{position:fixed;inset:0;background:#080a0e;z-index:5;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 19px 28px;gap:16px;transition:opacity .5s}.overlay.hidden{opacity:0;pointer-events:none}.boot-logo-wrap{display:flex;justify-content:center;align-items:center;min-height:92px;padding-top:10px}.boot-logo{font-size:28px;font-weight:700;letter-spacing:.16em;color:#f8f8f9;text-align:center;transform:translateY(16px) scale(.92);opacity:0;animation:logoIn 1.4s ease-out forwards;text-shadow:0 0 10px rgba(255,255,255,.06)}.boot-logo small{display:block;font-size:10px;letter-spacing:.42em;color:#aeb7c4;margin-top:8px}.boot-title{font-size:15px;font-weight:700;letter-spacing:.1em;border-bottom:1px solid #303a48;padding-bottom:12px}.boot-lines{font-size:11px;line-height:1.8;white-space:pre-wrap;flex:1;overflow:hidden;color:#e7ebef}.boot-footer{font-size:10px;color:#8e9aab}.progress{height:3px;background:#28303b;margin-top:10px}.progress>div{width:0;height:100%;background:#e6eef7;transition:width .12s}.flash{position:fixed;inset:0;pointer-events:none;background:rgba(255,255,255,.11);z-index:4;opacity:0}.flash.on{animation:fl .65s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}@keyframes logoIn{0%{opacity:0;transform:translateY(16px) scale(.92)}35%{opacity:1}62%{transform:translateY(0) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:365px){.logs{font-size:10.5px;padding-bottom:16px}.brand{font-size:11px}.clock{font-size:10px}.selector select{max-width:108px}button{padding:6px}.boot-logo{font-size:24px;letter-spacing:.12em}}
</style></head><body><div class="app"><header><div class="top"><div class="brand">MARKET//TERM <span style="color:#7f8c9d;font-weight:400">/ quant</span></div><div class="live"><span class="led"></span><span id="state">INITIALIZING</span></div></div><div class="toolbar"><div class="selector"><label for="mode">MODE</label><select id="mode" aria-label="分析モード"><option value="NASDAQ">NASDAQ</option><option value="FOREX">FOREX / FX</option><option value="CRYPTO">CRYPTO</option><option value="MACRO">GLOBAL MACRO</option></select></div><div id="clock" class="clock">--:--:--.--- <small>LOCAL</small></div></div></header><main id="logs" class="logs" aria-label="架空の金融分析ログ"></main><footer><span>DEMO · SYNTHETIC DATA</span><div class="actions"><button id="speed">×1</button><button id="pause">PAUSE</button><button id="clear">CLEAR</button></div></footer></div><div id="flash" class="flash"></div><div id="boot" class="overlay"><div class="boot-logo-wrap"><div class="boot-logo">KUMA BUNNSEKI<small>SYNTHETIC ANALYSIS SYSTEM</small></div></div><div class="boot-title">MARKET//TERM <span style="color:#8591a2">v5.0</span></div><div id="bootLines" class="boot-lines"></div><div class="boot-footer"><span id="bootStatus">ESTABLISHING LOCAL SESSION</span><div class="progress"><div id="bootProgress"></div></div></div></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),el=$('logs'),boot=$('boot'),bootLines=$('bootLines'),speedBtn=$('speed'),pauseBtn=$('pause'),state=$('state'),modeEl=$('mode'),clock=$('clock');
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choose=a=>a[rnd(0,a.length-1)],val=(a,b,d=2)=>(a+Math.random()*(b-a)).toFixed(d),sign=()=>Math.random()<.5?'-':'+',num=()=>rnd(10000,99999);
const modes={NASDAQ:{symbols:['NASDAQ100','NDX','QQQ','AAPL','MSFT','NVDA','AMZN','META','GOOGL','SOX','SPX','NQ_FUT'],topics:['order book reconstruction','gamma exposure mapping','dealer hedge estimation','earnings revision momentum','index breadth decomposition','0DTE options flow','volatility skew calibration','VWAP deviation scan'],models:['GARCH(1,1)','Heston IV surface','Kalman signal filter','Monte Carlo','factor momentum','Black-Scholes']},FOREX:{symbols:['USDJPY','EURUSD','GBPUSD','AUDUSD','EURJPY','USDCNH','DXY','USDCHF','NZDUSD','GBPJPY'],topics:['cross-currency basis','carry trade unwind stress','FX volatility smile','liquidity pool clustering','forward points interpolation','central bank divergence','spot-forward arbitrage scan','order flow imbalance'],models:['FX regime classifier','carry attribution','EWMA vol','stochastic FX model','Kalman trend filter']},CRYPTO:{symbols:['BTCUSD','ETHUSD','SOLUSD','BTCUSDT','ETHBTC','TOTAL3','BTC.D','SOLBTC'],topics:['perpetual funding dispersion','liquidation heatmap reconstruction','open interest acceleration','on-chain flow aggregation','basis convergence analysis','exchange reserve estimate','order book absorption','realized volatility clustering'],models:['funding rate model','liquidation cascade simulator','GARCH(1,1)','market impact estimator','on-chain factor model']},MACRO:{symbols:['SPX','UST10Y','UST2Y','DXY','GOLD','WTI','VIX','NIKKEI225','CPI_US','EURUSD','BRENT'],topics:['yield curve normalization','inflation expectation modeling','cross-asset covariance','global liquidity impulse','term premium decomposition','risk parity rebalance','macro scenario generation','policy surprise attribution'],models:['Bayesian VAR','principal component analysis','Monte Carlo','regime switching model','dynamic factor model']}};
let mode='NASDAQ',speed=1,paused=false,token=0,current=null,lineCount=0,burstRemaining=0,inEvent=false,eventsUntil=0,booting=true;
function timeStamp(){let d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`}
function clockTick(){clock.innerHTML=timeStamp()+' <small>LOCAL</small>'}clockTick();setInterval(clockTick,37);
function addLine(text='',kind=''){let n=document.createElement('div');n.className='line '+kind;n.textContent=text;el.appendChild(n);if(el.children.length>420)el.firstElementChild.remove();bottom();return n}
function bottom(){el.scrollTop=el.scrollHeight}
function logMessage(){const m=modes[mode],sym=choose(m.symbols),topic=choose(m.topics),model=choose(m.models);const list=[
()=>['',`${sym.padEnd(11)} LAST ${val(10,38000,3)}  Δ ${sign()}${val(.01,4.8)}%  VOL ${rnd(10000,9000000)}`],
()=>['muted',`[${timeStamp()}] feed.sync / ${sym}  packets=${rnd(100,9800)}`],
()=>['',`>> ${topic} :: batch=${num()}  priority=${choose(['LOW','NORMAL','HIGH'])}`],
()=>['',`σ=${val(.05,.92,5)}  β=${val(.4,1.95,5)}  α=${val(-.04,.06,6)}  R²=${val(.7,.999,5)}`],
()=>['',`MODEL/${model.replaceAll(' ','_')}  loss=${val(.00001,.6,7)}  iter=${rnd(50,4000)}`],
()=>['',`risk.var(99%, 1d)=${val(.3,5.9)}%   expected_shortfall=${val(1,9)}%`],
()=>['bright',`[SIGNAL] ${sym} => ${choose(['NEUTRAL','RISK_ON','RISK_OFF','WATCH','HEDGE_REVIEW'])}  confidence=${val(51,99)}%`],
()=>['',`matrix.corr(${sym},${choose(m.symbols)}) = ${val(-1,1,6)}`],
()=>['muted',`0x${rnd(1e7,9e7).toString(16)}  ${rnd(1000000,9999999).toString(16)}  ${rnd(1000000,9999999).toString(16)}`],
()=>['',`/research/${mode.toLowerCase()}/${topic.replaceAll(' ','_')}/result_${num()}.bin`],
()=>['',`spread=${val(.01,4,4)}bps | imbalance=${val(-.99,.99,4)} | depth=${rnd(100,90000)}`],
()=>['good',`[ OK ] ${choose(['synthetic data cache validated','covariance matrix completed','simulation snapshot synchronized','model parameters calibrated'])}`],
()=>['',`portfolio.exposure=[${Array.from({length:rnd(3,12)},()=>val(-1,1,4)).join(', ')}]`],
()=>['',`scenario.run(${model.replaceAll(' ','_')}, horizon=${rnd(1,360)}d, samples=${rnd(10000,999999)}) => convergence=${val(.000001,.01,7)}`],
()=>['muted',`tick ${num()} ${sym.padEnd(10)} BID ${val(50,25000,4)} / ASK ${val(50,25000,4)}`],
()=>['',`${sym} | z_score=${val(-4,4,4)} | residual=${val(-.2,.2,6)} | H=${val(.2,.85,4)} | likelihood=${val(.2,.99,5)}`]
];return choose(list)()}
const loads=['LOADING market data...','analyzing volatility surface...','reconstructing order flow...','calibrating regime classifier...','processing covariance matrix...','analyzing macro factors...','estimating liquidity conditions...'];
function schedule(delay){const t=++token;setTimeout(()=>{if(t===token&&!paused&&!booting)run()},Math.max(8,delay/speed))}
function startEvent(){inEvent=true;eventsUntil=rnd(16,34);burstRemaining=0;addLine('','muted');addLine('!  MARKET VOLATILITY EVENT / '+mode,'event');addLine('[ALERT] simulated market shock detected - initiating rapid recalculation','alert');$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');state.textContent='VOLATILITY SPIKE'}
function run(){
if(!current){
if(!inEvent&&lineCount>10&&Math.random()<.013)startEvent();
if(inEvent&&eventsUntil<=0){addLine('[ OK ] volatility event analysis complete - monitoring resumed','good');addLine('','muted');inEvent=false;state.textContent='SIMULATED LIVE'}
if(!inEvent&&Math.random()<.115){current={loading:true,txt:choose(loads),step:0,limit:rnd(6,16),node:addLine('','warn')}}
else{const [kind,txt]=logMessage();current={loading:false,txt,idx:0,node:addLine('',inEvent&&Math.random()<.2?'alert':kind)}}}
if(current.loading){current.step++;const pct=Math.min(99,Math.floor(current.step/current.limit*100));current.node.textContent=current.txt+' '+String(pct).padStart(2)+'%';bottom();if(current.step>=current.limit){current.node.textContent=current.txt+' 100% [OK]';current=null;schedule(rnd(180,850))}else schedule(rnd(170,510));return}
const chunk=inEvent?rnd(9,38):Math.random()<.3?rnd(1,3):rnd(4,16);current.idx=Math.min(current.txt.length,current.idx+chunk);current.node.textContent=current.txt.slice(0,current.idx);bottom();if(current.idx>=current.txt.length){current=null;lineCount++;if(inEvent){eventsUntil--;schedule(rnd(8,55))}else{if(Math.random()<.13)burstRemaining=rnd(4,11);if(burstRemaining>0){burstRemaining--;schedule(rnd(12,85))}else schedule(rnd(110,840))}}else schedule(inEvent?rnd(7,24):rnd(45,160))}
function changeMode(){token++;mode=modeEl.value;current=null;inEvent=false;lineCount=0;burstRemaining=0;el.textContent='';state.textContent=paused?'PAUSED':'SIMULATED LIVE';addLine('market@sim:~$ engine --switch-mode '+mode.toLowerCase(),'bright');addLine('[ OK ] '+mode+' synthetic data adapter initialized','good');addLine('NOTICE: Simulation only. No live prices, trades or network scanning.','muted');if(!paused&&!booting)schedule(380)}
modeEl.addEventListener('change',changeMode);
speedBtn.onclick=()=>{speed=speed===1?2:speed===2?5:1;speedBtn.textContent='×'+speed};
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';state.textContent=paused?'PAUSED':inEvent?'VOLATILITY SPIKE':'SIMULATED LIVE';if(paused)token++;else if(!booting)schedule(50)};
$('clear').onclick=()=>{token++;current=null;lineCount=0;burstRemaining=0;eventsUntil=0;inEvent=false;el.textContent='';addLine('market@sim:~$ clear','muted');state.textContent=paused?'PAUSED':'SIMULATED LIVE';if(!paused&&!booting)schedule(220)};
const steps=[['[BOOT] KUMA BUNNSEKI / SYNTHETIC ANALYSIS SYSTEM',450],['[ OK ] local runtime initialized',250],['[ OK ] memory integrity verified',320],['[AUTH] establishing simulated session...',450],['[AUTH] verifying demo credentials ********',580],['[AUTH] ACCESS GRANTED / LOCAL USER',370],['[INIT] loading market model registry',320],['[INIT] allocating synthetic price streams',420],['[INIT] preparing NASDAQ / FX / CRYPTO / MACRO adapters',440],['[ OK ] risk engine and covariance workspace ready',350],['[SYNC] starting simulated market feed...',510],['[READY] launching interactive terminal',260]];
let i=0;function bootNext(){if(i>=steps.length){$('bootProgress').style.width='100%';$('bootStatus').textContent='SESSION READY';setTimeout(()=>{boot.classList.add('hidden');setTimeout(()=>boot.remove(),650);booting=false;changeMode()},480);return}let [text,delay]=steps[i++];let div=document.createElement('div');div.textContent=text;bootLines.appendChild(div);bootLines.scrollTop=bootLines.scrollHeight;$('bootProgress').style.width=Math.round(i/steps.length*96)+'%';if(i===4)$('bootStatus').textContent='AUTHENTICATING';if(i===7)$('bootStatus').textContent='INITIALIZING ANALYTICS';setTimeout(bootNext,delay)}setTimeout(bootNext,420);
})();
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
